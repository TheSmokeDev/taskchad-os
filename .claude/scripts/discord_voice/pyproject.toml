[project]
name = "thehomie-discord-voice"
version = "0.1.0"
description = "Discord voice sidecar for The Homie — py-cord + DAVE realtime bridge (isolated venv: py-cord shares the `discord` namespace and cannot coexist with the main venv's discord.py)"
requires-python = ">=3.12"
dependencies = [
    "py-cord[voice]>=2.6.1",
    "PyNaCl>=1.5.0",
    "websockets>=14.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false
